seed: 1337

model:
  vocab_size: 8192
  dim: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  hidden_dim: 2048
  max_seq_len: 512
  rope_theta: 10000.0
  dropout: 0.0
  tie_embeddings: true

data:
  train_path: data/train_packed.npy
  val_path: data/val_packed.npy

training:
  micro_batch_size: 16
  grad_accum_steps: 8
  total_steps: 15000
  warmup_steps: 300
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  checkpoint_dir: /kaggle/working/checkpoints
  checkpoint_every: 500
  eval_every: 250
  log_every: 20
